<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的题库 · 勇敢DBA不怕困难</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --bg-primary:#0a0e1a; --bg-secondary:#131826;
  --bg-card:rgba(255,255,255,.04); --bg-card-hover:rgba(255,255,255,.08);
  --border-color:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.16);
  --text-primary:#fff; --text-secondary:#94a3b8; --text-muted:#64748b;
  --accent-blue:#3b82f6; --accent-purple:#8b5cf6; --accent-cyan:#06b6d4;
  --accent-green:#10b981; --accent-red:#ef4444; --accent-orange:#f59e0b;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg-primary);
  background-image:radial-gradient(at 20% 0%,rgba(59,130,246,.18) 0,transparent 50%),radial-gradient(at 80% 100%,rgba(139,92,246,.18) 0,transparent 50%),radial-gradient(at 50% 50%,rgba(6,182,212,.05) 0,transparent 50%);
  min-height:100vh; padding:24px 16px; color:var(--text-primary);
}
.container{max-width:960px;margin:0 auto;}
.header{text-align:center;margin-bottom:24px;padding:12px 0;}
.header-brand{display:inline-flex;align-items:center;gap:14px;margin-bottom:10px;}
.logo{width:44px;height:44px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;box-shadow:0 8px 24px rgba(59,130,246,.4);color:#fff;}
.header h1{font-size:26px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 0%,#94a3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header p{color:var(--text-secondary);font-size:13px;letter-spacing:.5px;margin-top:4px;}
.stats-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border-color);border-radius:14px;padding:16px;transition:all .3s;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,var(--accent-blue));opacity:.9;}
.stat-card.single{--card-accent:var(--accent-blue);} .stat-card.multiple{--card-accent:var(--accent-purple);}
.stat-card.judge{--card-accent:var(--accent-orange);} .stat-card.wrong{--card-accent:var(--accent-red);}
.stat-card:hover{background:var(--bg-card-hover);border-color:var(--border-hover);transform:translateY(-2px);}
.stat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.stat-card h4{font-size:12px;color:var(--text-secondary);font-weight:500;}
.stat-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.stat-card.single .stat-icon{background:rgba(59,130,246,.15);color:var(--accent-blue);}
.stat-card.multiple .stat-icon{background:rgba(139,92,246,.15);color:var(--accent-purple);}
.stat-card.judge .stat-icon{background:rgba(245,158,11,.15);color:var(--accent-orange);}
.stat-card.wrong .stat-icon{background:rgba(239,68,68,.15);color:var(--accent-red);}
.stat-rate{font-size:24px;font-weight:700;color:var(--text-primary);margin-bottom:4px;line-height:1;}
.stat-rate-suffix{font-size:13px;color:var(--text-muted);font-weight:500;margin-left:2px;}
.stat-details{display:flex;gap:10px;font-size:11px;color:var(--text-secondary);flex-wrap:wrap;}
.stat-details span{display:flex;align-items:center;gap:3px;}
.stat-details .dot{width:5px;height:5px;border-radius:50%;background:var(--card-accent);}
.main-card{background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border-color);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.tabs{display:flex;padding:5px;margin:14px 14px 0;background:rgba(0,0,0,.2);border-radius:12px;gap:4px;}
.tab{flex:1;padding:10px 10px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-secondary);transition:all .25s;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.tab:hover{color:var(--text-primary);}
.tab.active{background:var(--bg-card-hover);color:var(--text-primary);box-shadow:0 4px 12px rgba(0,0,0,.2);}
.tab-badge{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:7px;font-size:10px;font-weight:600;min-width:20px;text-align:center;}
.tab.active .tab-badge{background:var(--accent-blue);color:#fff;}
.tab[data-type="multiple"].active .tab-badge{background:var(--accent-purple);}
.tab[data-type="judge"].active .tab-badge{background:var(--accent-orange);}
.tab[data-type="wrong"].active .tab-badge{background:var(--accent-red);}
.actions{display:flex;padding:14px;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--border-color);}
.btn{padding:8px 13px;border:1px solid var(--border-color);border-radius:9px;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s;background:var(--bg-card);color:var(--text-secondary);display:inline-flex;align-items:center;gap:5px;}
.btn:hover{background:var(--bg-card-hover);border-color:var(--border-hover);color:var(--text-primary);transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:var(--accent-red);}
.btn-danger:hover{background:rgba(239,68,68,.25);border-color:var(--accent-red);}
.btn-warning{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:var(--accent-orange);}
.btn-warning:hover{background:rgba(245,158,11,.25);border-color:var(--accent-orange);}
.btn-primary{background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.25);}
.progress-bar{height:3px;background:rgba(255,255,255,.04);position:relative;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-blue),var(--accent-purple),var(--accent-cyan));transition:width .4s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(59,130,246,.5);}
.page-nav{padding:10px 14px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;border-bottom:1px solid var(--border-color);background:rgba(0,0,0,.1);}
.page-nav.hidden{display:none;}
.page-btn{padding:4px 9px;font-size:11px;font-weight:500;border:1px solid var(--border-color);border-radius:5px;cursor:pointer;background:var(--bg-card);color:var(--text-secondary);transition:all .2s;min-width:46px;text-align:center;}
.page-btn:hover{background:var(--bg-card-hover);border-color:var(--border-hover);color:var(--text-primary);}
.page-btn.active{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff;}
.page-info{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;margin-left:auto;}
.page-info input{width:46px;padding:3px 7px;border:1px solid var(--border-color);border-radius:5px;background:var(--bg-card);color:var(--text-primary);font-size:11px;text-align:center;}
.page-info input:focus{outline:none;border-color:var(--accent-blue);}
.question-area{padding:24px;min-height:360px;display:flex;gap:20px;}
.question-content{flex:1;min-width:0;}
.side-buttons{display:flex;flex-direction:column;gap:10px;width:110px;flex-shrink:0;padding-top:6px;}
.side-btn{width:100%;padding:13px 10px;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:12px;min-height:56px;}
.side-btn span{font-size:11px;}
.side-btn-submit{padding:18px 10px;min-height:74px;font-size:14px;font-weight:600;}
.side-btn:disabled{opacity:.4;cursor:not-allowed;}
.question-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.question-number{display:inline-flex;align-items:center;gap:7px;color:var(--text-secondary);font-size:12px;font-weight:500;}
.question-number .num{background:rgba(59,130,246,.15);color:var(--accent-blue);padding:3px 9px;border-radius:5px;font-weight:600;}
.question-type-tag{font-size:10px;padding:3px 9px;border-radius:5px;font-weight:600;letter-spacing:.5px;}
.question-type-tag.single{background:rgba(59,130,246,.15);color:var(--accent-blue);}
.question-type-tag.multiple{background:rgba(139,92,246,.15);color:var(--accent-purple);}
.question-type-tag.judge{background:rgba(245,158,11,.15);color:var(--accent-orange);}
.mastered-badge{font-size:10px;padding:3px 9px;border-radius:5px;font-weight:600;background:rgba(16,185,129,.15);color:var(--accent-green);margin-left:6px;}
.question-text{font-size:15px;line-height:1.7;color:var(--text-primary);margin-bottom:18px;padding:18px;background:rgba(0,0,0,.2);border:1px solid var(--border-color);border-radius:12px;font-weight:400;white-space:pre-wrap;word-break:break-word;}
.options{list-style:none;display:flex;flex-direction:column;gap:9px;}
.option-item{display:flex;align-items:center;padding:14px 16px;border:1px solid var(--border-color);border-radius:11px;cursor:pointer;transition:all .2s;background:var(--bg-card);position:relative;overflow:hidden;}
.option-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s;}
.option-item:hover:not(.answered){border-color:var(--border-hover);background:var(--bg-card-hover);transform:translateX(2px);}
.option-item.selected{border-color:var(--accent-blue);background:rgba(59,130,246,.08);}
.option-item.selected::before{background:var(--accent-blue);}
.option-item.correct{border-color:var(--accent-green);background:rgba(16,185,129,.08);}
.option-item.correct::before{background:var(--accent-green);}
.option-item.incorrect{border-color:var(--accent-red);background:rgba(239,68,68,.08);}
.option-item.incorrect::before{background:var(--accent-red);}
.option-letter{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-right:14px;background:rgba(255,255,255,.04);color:var(--text-secondary);flex-shrink:0;transition:all .2s;}
.option-item.selected .option-letter{background:var(--accent-blue);color:#fff;}
.option-item.correct .option-letter{background:var(--accent-green);color:#fff;}
.option-item.incorrect .option-letter{background:var(--accent-red);color:#fff;}
.option-item input[type=radio],.option-item input[type=checkbox]{display:none;}
.option-item label{flex:1;cursor:pointer;font-size:14px;line-height:1.5;color:var(--text-primary);}
.answer-area{margin-top:18px;padding:14px 16px;border-radius:11px;display:none;align-items:center;gap:12px;animation:slideIn .3s;}
.answer-area.show{display:flex;}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.answer-area.correct{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);}
.answer-area.incorrect{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);}
.answer-content{flex:1;}
.answer-title{font-weight:600;font-size:13px;margin-bottom:2px;}
.answer-area.correct .answer-title{color:var(--accent-green);}
.answer-area.incorrect .answer-title{color:var(--accent-red);}
.answer-detail{font-size:12px;color:var(--text-secondary);}
.answer-detail .correct-answer{color:var(--accent-green);font-weight:700;font-family:'JetBrains Mono','Courier New',monospace;letter-spacing:1px;margin-left:3px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.95);backdrop-filter:blur(20px);border:1px solid var(--border-color);color:#fff;padding:10px 22px;border-radius:11px;font-size:13px;z-index:1000;opacity:0;transition:all .3s;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty h3{font-size:16px;margin-bottom:8px;color:var(--text-secondary);}
.footer-note{text-align:center;color:var(--text-muted);font-size:11px;margin-top:18px;line-height:1.6;}
.footer-note a{color:var(--accent-blue);text-decoration:none;}
@media(max-width:768px){
  body{padding:14px 10px;}
  .header h1{font-size:20px;}
  .stats-panel{grid-template-columns:repeat(2,1fr);}
  .question-area{padding:16px;flex-direction:column;}
  .question-text{font-size:14px;padding:14px;}
  .option-item{padding:12px 14px;}
  .side-buttons{width:100%;flex-direction:row;justify-content:space-between;padding-top:16px;}
  .side-btn{flex-direction:row;min-height:44px;flex:1;}
  .side-btn-submit{min-height:44px;flex:1.5;}
  .tab{font-size:11px;padding:9px 6px;}
}

/* 2026 focused practice refresh */

  --accent-blue:#d04a2b;--accent-purple:#76533d;--accent-cyan:#168b85;
  --accent-green:#237957;--accent-red:#bd3e32;--accent-orange:#b06c17;
}
body{background:var(--bg-primary);background-image:linear-gradient(rgba(40,38,33,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(40,38,33,.035) 1px,transparent 1px);background-size:32px 32px;padding:0 18px 40px;color:var(--text-primary);}

.header-brand{margin:0;gap:10px}.logo{width:34px;height:34px;border-radius:8px;background:var(--text-primary);box-shadow:none;font-size:13px}.header h1{font-size:18px;letter-spacing:-.02em;background:none;-webkit-text-fill-color:currentColor;color:var(--text-primary)}
.header p{margin:0;font:600 11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em;color:var(--text-muted)}
.back-home{color:var(--text-secondary);text-decoration:none;font-size:12px;font-weight:650;margin-right:14px}.back-home:hover{color:var(--accent-blue)}
.stats-panel{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;margin-bottom:12px}.stat-card{padding:12px 14px;border-radius:9px;background:var(--bg-card);backdrop-filter:none}.stat-card::before{height:2px}.stat-card:hover{transform:none}.stat-header{margin-bottom:5px}.stat-icon{display:none}.stat-rate{font-size:20px;display:inline}.stat-details{display:inline-flex;margin-left:10px}.stat-details span:not(:first-child){display:none}
.main-card{border-radius:12px;background:var(--bg-card);backdrop-filter:none;box-shadow:0 12px 34px rgba(60,48,35,.07)}
.tabs{margin:0;padding:8px;background:transparent;border-bottom:1px solid var(--border-color);border-radius:0;gap:5px}.tab{flex:0 1 auto;padding:9px 14px;border-radius:7px}.tab.active{background:var(--text-primary);color:#fff;box-shadow:none}.tab-badge{background:rgba(0,0,0,.06)}.tab.active .tab-badge,.tab[data-type].active .tab-badge{background:rgba(255,255,255,.16)}
.actions{padding:9px 12px;border-bottom:1px solid var(--border-color)}.btn{border-radius:7px;background:transparent}.btn:hover{transform:none}.btn-primary{background:var(--accent-blue);box-shadow:none}.progress-bar{height:4px;background:var(--bg-secondary)}.progress-fill{background:var(--accent-blue);box-shadow:none}
.page-nav{padding:10px 12px;justify-content:flex-start;background:#faf7f1;border-bottom:1px solid var(--border-color)}.page-nav>div{flex-wrap:nowrap!important;overflow-x:auto;justify-content:flex-start!important;padding-bottom:2px}.page-btn{padding:6px;min-width:32px;border-radius:6px;background:#fff}.page-btn.active{background:var(--accent-blue);border-color:var(--accent-blue)}.page-info{margin-left:auto;white-space:nowrap}.page-info input{width:58px;padding:6px;border-color:var(--border-color);background:#fff;color:var(--text-primary)}
.question-area{padding:clamp(20px,3vw,42px) clamp(16px,4vw,48px);min-height:440px;display:block}.question-content{width:min(100%,1040px);margin:0 auto}.side-buttons{width:min(100%,1040px);margin:24px auto 0;padding-top:18px;border-top:1px solid var(--border-color);display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);flex-direction:row}.side-btn{min-width:0;min-height:46px;flex-direction:row}.side-btn-submit{min-height:46px}
.question-meta{margin-bottom:14px}.question-number .num{background:#eee7dd;color:var(--text-secondary)}.question-type-tag.single,.question-type-tag.multiple,.question-type-tag.judge{background:#eee7dd;color:var(--text-secondary)}
.question-text{font-size:17px;line-height:1.75;padding:0;margin-bottom:22px;background:transparent;border:0;font-weight:620}.options{gap:10px}.option-item{padding:15px;border-radius:8px;background:#fff;border-color:var(--border-color)}.option-item:hover:not(.answered){transform:none;border-color:var(--accent-blue);background:#fffaf5}.option-letter{border:1px solid var(--border-color);background:#faf7f1}.option-item.selected{background:#fff4ed}.option-item.selected .option-letter{background:var(--accent-blue);border-color:var(--accent-blue)}
.answer-area{border-radius:8px}.footer-note{color:var(--text-muted)}.toast{background:#25231f;border:0;border-radius:8px}.empty{padding:50px 20px}

@media(max-width:420px){.header{margin-bottom:12px}.header h1{font-size:16px}.stats-panel{gap:6px}.stat-details{margin-left:5px}.question-meta{align-items:flex-start}.option-item{padding:12px 10px}.option-letter{margin-right:10px}.side-buttons{position:sticky;bottom:6px;z-index:20;padding:8px;background:rgba(255,253,249,.94);border:1px solid var(--border-color);border-radius:10px}.page-info{margin-left:0}.page-nav{justify-content:space-between}}
</style>

<body>
<div class="container">
  <div class="header">
    <div class="header-brand">
      <div class="logo">题</div>
      <div><h1>我的题库</h1><p id="bank-summary">正在读取本地题库…</p></div>
    </div>
    <div class="header-right"><a class="back-home" href="/quiz-library/">← 返回题库</a><p>FOCUS MODE / LOCAL PROGRESS</p></div>
  </div>
  <div class="stats-panel">
    <div class="stat-card single"><div class="stat-header"><h4>单选题</h4><div class="stat-icon">单</div></div><div class="stat-rate"><span id="single-rate">0</span><span class="stat-rate-suffix">%</span></div><div class="stat-details"><span><span class="dot"></span>答 <span id="single-total">0</span></span><span>对 <span id="single-correct">0</span></span><span>错 <span id="single-incorrect">0</span></span></div></div>
    <div class="stat-card multiple"><div class="stat-header"><h4>多选题</h4><div class="stat-icon">多</div></div><div class="stat-rate"><span id="multiple-rate">0</span><span class="stat-rate-suffix">%</span></div><div class="stat-details"><span><span class="dot"></span>答 <span id="multiple-total">0</span></span><span>对 <span id="multiple-correct">0</span></span><span>错 <span id="multiple-incorrect">0</span></span></div></div>
    <div class="stat-card judge"><div class="stat-header"><h4>判断题</h4><div class="stat-icon">判</div></div><div class="stat-rate"><span id="judge-rate">0</span><span class="stat-rate-suffix">%</span></div><div class="stat-details"><span><span class="dot"></span>答 <span id="judge-total">0</span></span><span>对 <span id="judge-correct">0</span></span><span>错 <span id="judge-incorrect">0</span></span></div></div>
    <div class="stat-card wrong"><div class="stat-header"><h4>错题本</h4><div class="stat-icon">错</div></div><div class="stat-rate"><span id="wrong-rate">0</span><span class="stat-rate-suffix">%</span></div><div class="stat-details"><span><span class="dot"></span>总错 <span id="wrong-total">0</span></span><span>攻克 <span id="wrong-mastered">0</span></span></div></div>
  </div>
  <div class="main-card">
    <div class="tabs">
      <div class="tab active" data-type="single">单选题 <span class="tab-badge" id="single-count">0</span></div>
      <div class="tab" data-type="multiple">多选题 <span class="tab-badge" id="multiple-count">0</span></div>
      <div class="tab" data-type="judge">判断题 <span class="tab-badge" id="judge-count">0</span></div>
      <div class="tab" data-type="wrong">错题 <span class="tab-badge" id="wrong-count">0</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="shuffle-btn">🔀 打乱</button>
      <button class="btn btn-danger" id="clear-wrong">🗑 清除错题</button>
      <button class="btn btn-warning" id="reset-record">↻ 重置记录</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="page-nav hidden" id="page-nav"><div id="page-nav-buttons" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;"></div><div class="page-info">跳转 <input type="number" id="jump-input" min="1"></div></div>
    <div class="question-area">
      <div class="question-content" id="question-content"></div>
      <div class="side-buttons" id="side-buttons" style="display:none;">
        <button class="btn side-btn" id="prev-btn-side"><span>‹ 上一题</span></button>
        <button class="btn btn-primary side-btn side-btn-submit" id="submit-btn">提交</button>
        <button class="btn side-btn" id="next-btn-side"><span>下一题 ›</span></button>
      </div>
    </div>
  </div>
  <div class="footer-note">题库和答题记录只存于当前浏览器｜可在<a href="/quiz-library/">题库管理</a>中新建、编辑或上传题库</div>
</div>
<div class="toast" id="toast"></div>
<script>
let RAW={single:[],multiple:[],judge:[]};
let bankName='我的题库';
let bankId=localStorage.getItem('quiz-current-bank-id')||'current';
try{
  const saved=JSON.parse(localStorage.getItem('quiz-current-bank')||'null');
  if(saved&&['single','multiple','judge'].some(function(t){return Array.isArray(saved[t])&&saved[t].length;})){
    RAW=saved;
    bankName=localStorage.getItem('quiz-current-bank-name')||'我的题库';
  }else{
    window.location.replace('/quiz-library/?empty=1');
  }
}catch(e){window.location.replace('/quiz-library/?invalid=1');}
['single','multiple','judge'].forEach(function(t){if(!Array.isArray(RAW[t]))RAW[t]=[];});
const questions = {
  single: RAW.single.map(function(q,i){return {id:i+1,text:q.q,options:q.options,answer:q.answer};}),
  multiple: RAW.multiple.map(function(q,i){return {id:i+1,text:q.q,options:q.options,answer:q.answer};}),
  judge: RAW.judge.map(function(q,i){return {id:i+1,text:q.q,options:q.options,answer:q.answer};}),
  wrong: []
};
let currentIndex = 0, currentType = ['single','multiple','judge'].find(function(t){return questions[t].length;})||'single';
let answeredQuestions = new Set();
let wrongSet = new Set(), mastered = new Set();
let stats = {single:{total:0,correct:0,incorrect:0},multiple:{total:0,correct:0,incorrect:0},judge:{total:0,correct:0,incorrect:0}};
const KEY = 'quiz-bank-'+bankId+'-';
document.querySelector('.header h1').textContent=bankName;
document.getElementById('bank-summary').textContent=(RAW.single.length+RAW.multiple.length+RAW.judge.length)+' 题 · 记录只保存在当前浏览器';
document.title=bankName+' · 勇敢DBA不怕困难';
['single','multiple','judge'].forEach(function(t){
  document.getElementById(t+'-count').textContent=questions[t].length;
  var tab=document.querySelector('.tab[data-type="'+t+'"]');
  tab.classList.toggle('active',t===currentType);
  tab.style.display=questions[t].length?'flex':'none';
});
function load(){try{
  let s=localStorage.getItem(KEY+'stats');if(s)stats=JSON.parse(s);
  let w=localStorage.getItem(KEY+'wrong');if(w)wrongSet=new Set(JSON.parse(w));
  let m=localStorage.getItem(KEY+'mastered');if(m)mastered=new Set(JSON.parse(m));
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(KEY+'stat-')===0)answeredQuestions.add(k.substring((KEY+'stat-').length));}
}catch(e){}}
function saveStats(){localStorage.setItem(KEY+'stats',JSON.stringify(stats));}
function saveWrong(){localStorage.setItem(KEY+'wrong',JSON.stringify(Array.from(wrongSet)));}
function saveMastered(){localStorage.setItem(KEY+'mastered',JSON.stringify(Array.from(mastered)));}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
function rebuildWrong(){
  questions.wrong=[];
  wrongSet.forEach(function(key){
    var mt=key.match(/^(single|multiple|judge)-(\d+)$/);
    if(mt&&questions[mt[1]][parseInt(mt[2])]){
      var o=questions[mt[1]][parseInt(mt[2])];
      questions.wrong.push({text:o.text,options:o.options,answer:o.answer,sourceType:mt[1],sourceIndex:parseInt(mt[2])});
    }
  });
}
function updateStats(){
  ['single','multiple','judge'].forEach(function(t){
    document.getElementById(t+'-total').textContent=stats[t].total;
    document.getElementById(t+'-correct').textContent=stats[t].correct;
    document.getElementById(t+'-incorrect').textContent=stats[t].incorrect;
    document.getElementById(t+'-rate').textContent=stats[t].total>0?Math.round(stats[t].correct/stats[t].total*100):0;
  });
  document.getElementById('wrong-count').textContent=wrongSet.size;
  document.getElementById('wrong-total').textContent=wrongSet.size;
  document.getElementById('wrong-mastered').textContent=mastered.size;
  document.getElementById('wrong-rate').textContent=wrongSet.size>0?Math.round(mastered.size/wrongSet.size*100):0;
}
function shuffleArr(a){a=[].concat(a);for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function shuffleWithOptions(arr){
  arr=shuffleArr(arr);
  arr.forEach(function(q){
    if(!q.options||q.options.length<2)return;
    var idx=q.options.map(function(_,i){return i;});
    var sh=shuffleArr(idx);
    var L=['A','B','C','D','E','F'];
    var newOpts=sh.map(function(oi){return q.options[oi];});
    var oldAns=q.answer.toUpperCase().split('').sort();
    var newAns=oldAns.map(function(ol){var oi=L.indexOf(ol);var ni=sh.indexOf(oi);return L[ni];}).sort().join('');
    q.options=newOpts;q.answer=newAns;
  });
  return arr;
}
function checkAns(q,uans){
  if(!uans)return false;
  return uans===q.answer.split('').sort().join('');
}
function render(){
  var list=questions[currentType];
  if(list.length===0){
    document.getElementById('question-content').innerHTML='<div class="empty"><h3>暂无错题</h3><p>答错的题会自动收集到这里</p></div>';
    document.getElementById('side-buttons').style.display='none';
    document.getElementById('progress-fill').style.width='0%';
    document.getElementById('page-nav').classList.add('hidden');
    return;
  }
  document.getElementById('side-buttons').style.display='flex';
  var q=list[currentIndex];
  var isAns=answeredQuestions.has(currentType+'-'+currentIndex);
  var userAns=localStorage.getItem(KEY+currentType+'-'+currentIndex+'-answer');
  var eff=currentType;
  if(currentType==='wrong'&&q.sourceType)eff=q.sourceType;
  var inputType=eff==='multiple'?'checkbox':'radio';
  var typeLabel={single:'单选题',multiple:'多选题',judge:'判断题'}[eff];
  var L=['A','B','C','D','E','F'];
  var optsHtml='';
  q.options.forEach(function(opt,idx){
    var sel=userAns&&(eff==='multiple'?userAns.indexOf(L[idx])>=0:userAns===L[idx]);
    var cls='',icon='';
    if(isAns){
      var correct=q.answer.indexOf(L[idx])>=0;
      if(correct){cls='correct';icon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-left:10px;color:var(--accent-green)"><polyline points="20 6 9 17 4 12"></polyline></svg>';}
      else if(sel){cls='incorrect';icon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-left:10px;color:var(--accent-red)"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';}
    }else if(sel){cls='selected';}
    optsHtml+='<li class="option-item '+cls+(isAns?' answered':'')+'" data-letter="'+L[idx]+'"><div class="option-letter">'+L[idx]+'</div><input type="'+inputType+'" name="ans" value="'+L[idx]+'" '+(sel?'checked':'')+(isAns?' disabled':'')+'><label>'+escapeHtml(opt)+'</label>'+icon+'</li>';
  });
  document.getElementById('progress-fill').style.width=((currentIndex+1)/list.length*100)+'%';
  var correct=isAns?checkAns(q,userAns):false;
  var masteredBadge='';
  if(currentType==='wrong'&&q.sourceType&&mastered.has(q.sourceType+'-'+q.sourceIndex)){masteredBadge='<span class="mastered-badge">已攻克 ✓</span>';}
  var metaHtml='<div class="question-meta"><div class="question-number"><span class="num">'+(currentIndex+1)+' / '+list.length+'</span></div><div class="question-type-tag '+eff+'">'+typeLabel+'</div>'+masteredBadge+'</div>';
  var qHtml='<div class="question-text">'+escapeHtml(q.text)+'</div><ul class="options">'+optsHtml+'</ul>';
  var ansHtml='<div class="answer-area '+(isAns?'show '+(correct?'correct':'incorrect'):'')+'"><div class="answer-content"><div class="answer-title">'+(correct?'回答正确':'回答错误')+'</div><div class="answer-detail">正确答案<span class="correct-answer">'+escapeHtml(q.answer)+'</span></div></div></div>';
  document.getElementById('question-content').innerHTML=metaHtml+qHtml+ansHtml;
  document.querySelectorAll('.option-item').forEach(function(item){
    item.addEventListener('click',function(){
      if(item.classList.contains('answered'))return;
      var inp=item.querySelector('input');
      if(inp.type==='radio'){
        document.querySelectorAll('.option-item').forEach(function(o){o.classList.remove('selected');});
        inp.checked=true;item.classList.add('selected');
        localStorage.setItem(KEY+currentType+'-'+currentIndex+'-answer',inp.value);
        if(eff!=='multiple')setTimeout(function(){submit();},150);
      }else{
        inp.checked=!inp.checked;item.classList.toggle('selected',inp.checked);
        var cv=[].map.call(document.querySelectorAll('.option-item input:checked'),function(i){return i.value;}).sort().join('');
        localStorage.setItem(KEY+currentType+'-'+currentIndex+'-answer',cv);
      }
    });
  });
  document.getElementById('prev-btn-side').disabled=currentIndex===0;
  document.getElementById('next-btn-side').disabled=currentIndex===list.length-1;
  document.getElementById('submit-btn').disabled=isAns;
  genPageNav(list);
}
function genPageNav(list){
  var nav=document.getElementById('page-nav');
  if(list.length===0){nav.classList.add('hidden');return;}
  nav.classList.remove('hidden');
  var box=document.getElementById('page-nav-buttons');
  box.innerHTML='';
  var total=list.length, indexes=[];
  [0,currentIndex-3,currentIndex-2,currentIndex-1,currentIndex,currentIndex+1,currentIndex+2,currentIndex+3,total-1].forEach(function(i){if(i>=0&&i<total&&indexes.indexOf(i)<0)indexes.push(i);});
  indexes.sort(function(a,b){return a-b;});
  var last=-2;
  indexes.forEach(function(i){
    if(i-last>1){var gap=document.createElement('span');gap.textContent='…';gap.style.cssText='padding:5px 2px;color:var(--text-muted)';box.appendChild(gap);}
    var b=document.createElement('button');
    b.className='page-btn'+(currentIndex===i?' active':'');
    b.textContent=i+1;
    b.title='跳到第 '+(i+1)+' 题';
    b.addEventListener('click',function(){currentIndex=i;render();});
    box.appendChild(b);
    last=i;
  });
  var ji=document.getElementById('jump-input');
  ji.max=total;ji.value='';
  ji.onkeypress=function(e){if(e.key==='Enter'){var n=parseInt(ji.value);if(n>=1&&n<=total){currentIndex=n-1;render();}else{showToast('请输入 1-'+total);}}};
}
function submit(){
  var list=questions[currentType];
  var q=list[currentIndex];
  var checked=document.querySelectorAll('.option-item input:checked');
  var eff=currentType;
  if(currentType==='wrong'&&q.sourceType)eff=q.sourceType;
  var uans='';
  if(eff==='multiple'){uans=[].map.call(checked,function(i){return i.value;}).sort().join('');}
  else{uans=checked.length>0?checked[0].value:'';}
  if(!uans){showToast('请先选择答案');return;}
  localStorage.setItem(KEY+currentType+'-'+currentIndex+'-answer',uans);
  answeredQuestions.add(currentType+'-'+currentIndex);
  var correct=checkAns(q,uans);
  var sk=currentType+'-'+currentIndex;
  if(!localStorage.getItem(KEY+'stat-'+sk)){
    if(currentType!=='wrong'){
      stats[currentType].total++;
      if(correct)stats[currentType].correct++;else stats[currentType].incorrect++;
      saveStats();updateStats();
    }
    localStorage.setItem(KEY+'stat-'+sk,correct?'correct':'incorrect');
  }
  if(currentType==='wrong'){
    if(correct){var wk=q.sourceType+'-'+q.sourceIndex;mastered.add(wk);saveMastered();updateStats();showToast('答对！已攻克');}
  }else{
    if(!correct){var wk=currentType+'-'+currentIndex;if(!wrongSet.has(wk)){wrongSet.add(wk);saveWrong();rebuildWrong();updateStats();showToast('已加入错题本');}}
  }
  render();
  if(correct&&currentIndex<list.length-1){showToast('回答正确，可以进入下一题');}
}
// 事件绑定
document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    tab.classList.add('active');
    currentType=tab.dataset.type;
    if(currentType==='wrong')rebuildWrong();
    currentIndex=0;render();
  });
});
document.getElementById('shuffle-btn').addEventListener('click',function(){
  if(questions[currentType].length===0){showToast('暂无题目');return;}
  questions[currentType]=shuffleWithOptions(questions[currentType]);
  currentIndex=0;render();showToast('题目和选项已打乱');
});
document.getElementById('clear-wrong').addEventListener('click',function(){
  if(wrongSet.size===0){showToast('暂无错题');return;}
  if(confirm('确定清除全部 '+wrongSet.size+' 道错题吗？')){
    wrongSet.clear();mastered.clear();questions.wrong=[];currentIndex=0;
    localStorage.removeItem(KEY+'wrong');localStorage.removeItem(KEY+'mastered');
    updateStats();render();showToast('错题已清除');
  }
});
document.getElementById('reset-record').addEventListener('click',function(){
  if(!confirm('确定重置所有答题记录吗？（统计数据、错题、已答状态全清）'))return;
  Object.keys(stats).forEach(function(t){stats[t]={total:0,correct:0,incorrect:0};});
  wrongSet.clear();mastered.clear();answeredQuestions.clear();
  saveStats();saveWrong();saveMastered();
  Object.keys(localStorage).filter(function(k){return k.indexOf(KEY)===0;}).forEach(function(k){localStorage.removeItem(k);});
  stats={single:{total:0,correct:0,incorrect:0},multiple:{total:0,correct:0,incorrect:0},judge:{total:0,correct:0,incorrect:0}};
  saveStats();updateStats();currentIndex=0;render();showToast('记录已重置');
});
document.getElementById('prev-btn-side').addEventListener('click',function(){if(currentIndex>0){currentIndex--;render();}});
document.getElementById('next-btn-side').addEventListener('click',function(){if(currentIndex<questions[currentType].length-1){currentIndex++;render();}});
document.getElementById('submit-btn').addEventListener('click',submit);
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft'&&currentIndex>0){currentIndex--;render();}
  if(e.key==='ArrowRight'&&currentIndex<questions[currentType].length-1){currentIndex++;render();}
  if(e.key==='Enter'&&!document.getElementById('submit-btn').disabled)submit();
});
// 初始化
load();updateStats();rebuildWrong();render();
</script>
</body>
</html>
