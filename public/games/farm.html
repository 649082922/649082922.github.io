<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖阳菜园 · 种菜大亨</title>
<style>
  :root{
    --sky1:#ffe7b0; --sky2:#ffcf85; --ground:#9c7240;
    --soil1:#6b4423; --soil2:#4a2d15;
    --gold:#ffc24d; --gold-d:#e09a2a;
    --leaf:#7cb342; --leaf-d:#558b2f;
    --cream:#fff6e6; --panel:#fffaf0;
    --ink:#4a3520; --ink-s:#7a6448;
    --line:#ecd9b8; --accent:#e98a3b;
    --red:#e53935; --shadow:0 6px 18px rgba(120,80,40,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#ffeccb 0%, #ffe0b3 60%, #f6cf95 100%);
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; max-width:1040px; margin:0 auto;
    padding:10px 12px; gap:10px;
  }

  /* 顶部状态栏 */
  header.topbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:linear-gradient(180deg,#fff6e2,#ffe9c4);
    border:1.5px solid var(--line); border-radius:16px;
    padding:10px 16px; box-shadow:var(--shadow);
  }
  .brand{display:flex; flex-direction:column; margin-right:auto;}
  .brand b{font-size:20px; letter-spacing:1px; color:var(--ink);}
  .brand small{font-size:11px; color:var(--ink-s);}
  .stat{display:flex; align-items:center; gap:8px; font-weight:600;}
  .coin{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3c0, var(--gold) 55%, var(--gold-d));
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.15);
    border:1.5px solid #f0b835; position:relative;
  }
  .coin::after{
    content:""; position:absolute; inset:6px; border-radius:50%;
    border:1.5px dashed rgba(255,255,255,.6);
  }
  .gold-num{font-size:18px; color:var(--gold-d); min-width:36px;}
  .lv-badge{
    background:linear-gradient(180deg,#8bc34a,#558b2f); color:#fff;
    padding:3px 10px; border-radius:20px; font-size:13px; font-weight:700;
    box-shadow:0 2px 4px rgba(85,139,47,.35);
  }
  .xp-wrap{width:140px;}
  .xp-track{height:9px; background:#e8d3a8; border-radius:6px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.12);}
  .xp-fill{height:100%; width:0%; background:linear-gradient(90deg,#aed581,#7cb342); transition:width .3s;}
  .xp-text{font-size:10px; color:var(--ink-s); margin-top:2px;}
  .weather-tag{display:flex; align-items:center; gap:6px; font-size:13px; padding:4px 10px; border-radius:20px; background:#fff3d9; border:1px solid var(--line);}
  .w-icon{width:14px; height:14px; border-radius:50%; display:inline-block;}
  .w-sunny .w-icon{background:radial-gradient(circle,#fff3b0,#ffc24d);}
  .w-rain .w-icon{background:radial-gradient(circle,#cfe8ff,#5aa0e0);}
  .w-drought .w-icon{background:radial-gradient(circle,#ffd0a0,#e8623a);}
  .w-festival .w-icon{background:radial-gradient(circle,#ffe082,#ff8f00);}
  .reset-btn{
    border:1px solid var(--line); background:#fff; color:var(--ink-s);
    border-radius:8px; padding:5px 10px; font-size:11px; cursor:pointer;
  }
  .reset-btn:hover{color:var(--red); border-color:#f3c2bd;}

  /* 主体 */
  main{display:flex; gap:12px; flex:1; min-height:0;}
  .stage{
    position:relative; flex:1; min-width:0;
    border-radius:18px; overflow:hidden;
    border:2px solid #e7c896; box-shadow:var(--shadow);
    background:#caa274;
  }
  #farm{display:block; width:100%; height:auto; aspect-ratio:720/560;}
  #floatLayer{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .float-text{
    position:absolute; transform:translate(-50%,0);
    font-weight:800; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.45);
    font-size:15px; animation:floatUp 1.1s ease-out forwards;
  }
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,0) scale(.6);}
    20%{opacity:1; transform:translate(-50%,-6px) scale(1.1);}
    100%{opacity:0; transform:translate(-50%,-44px) scale(1);}
  }

  /* 侧栏 */
  .side{width:250px; display:flex; flex-direction:column; gap:10px; min-height:0;}
  .panel{
    background:var(--panel); border:1.5px solid var(--line);
    border-radius:14px; padding:10px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:0;
  }
  .panel-title{
    font-size:13px; margin:0 0 8px; color:var(--ink);
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-title b{font-size:14px;}
  .panel-title .cnt{font-size:11px; color:var(--ink-s); font-weight:600;}
  #shopList{overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:7px; padding-right:2px;}
  #shopList::-webkit-scrollbar{width:6px;}
  #shopList::-webkit-scrollbar-thumb{background:#e0c69a; border-radius:3px;}

  .shop-item{
    display:flex; gap:9px; align-items:center; text-align:left;
    background:linear-gradient(180deg,#fffaf0,#fff0d8);
    border:1.5px solid var(--line); border-radius:11px;
    padding:7px 9px; cursor:pointer; transition:.15s; position:relative;
  }
  .shop-item:hover{transform:translateY(-1px); border-color:#e0b06a;}
  .shop-item.selected{
    border-color:var(--accent); background:linear-gradient(180deg,#fff4e0,#ffe2b8);
    box-shadow:0 0 0 2px rgba(233,138,59,.25);
  }
  .shop-item.selected::before{
    content:""; position:absolute; left:-1px; top:8px; bottom:8px; width:3px;
    background:var(--accent); border-radius:3px;
  }
  .shop-item.locked{opacity:.5; filter:grayscale(.5); cursor:not-allowed;}
  .shop-item.disabled .si-cost{color:var(--red);}
  .si-icon{width:42px; height:42px; border-radius:9px; flex-shrink:0; background:#fff;}
  .si-info{flex:1; min-width:0;}
  .si-row{display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
  .si-name{font-weight:700; font-size:13px;}
  .si-lock{font-size:10px; color:#fff; background:#b08d57; padding:1px 6px; border-radius:8px; margin-left:auto;}
  .si-cost{font-size:11px; color:var(--gold-d); font-weight:700;}
  .si-sell{font-size:11px; color:var(--leaf-d); font-weight:700;}
  .si-time{font-size:11px; color:var(--ink-s);}
  .si-dot{font-size:11px; color:var(--ink-s); opacity:.6;}
  .si-desc{font-size:10px; color:var(--ink-s); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .shop-hint{font-size:10px; color:var(--ink-s); margin-top:6px; line-height:1.5;}

  #achBox{overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:5px;}
  #achBox::-webkit-scrollbar{width:6px;}
  #achBox::-webkit-scrollbar-thumb{background:#e0c69a; border-radius:3px;}
  .ach{
    display:flex; flex-direction:column; padding:5px 8px; border-radius:8px;
    background:#f6ece0; border:1px solid transparent; opacity:.55;
  }
  .ach.got{opacity:1; background:linear-gradient(180deg,#fff7df,#ffe9b8); border-color:#e8c878;}
  .ach-name{font-size:12px; font-weight:700; color:var(--ink);}
  .ach.got .ach-name{color:var(--accent);}
  .ach-desc{font-size:10px; color:var(--ink-s);}

  /* 日志 */
  footer.logbar{
    background:var(--panel); border:1.5px solid var(--line); border-radius:12px;
    padding:6px 12px; max-height:74px; display:flex; flex-direction:column; box-shadow:var(--shadow);
  }
  .log-title{font-size:11px; color:var(--ink-s); font-weight:700; margin-bottom:2px;}
  #logBox{overflow-y:auto; font-size:11px; line-height:1.55; color:var(--ink-s);}
  .log-line{animation:logIn .25s;}
  @keyframes logIn{from{opacity:0; transform:translateX(-4px);} to{opacity:1;}}

  /* toast */
  #toasts{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; flex-direction:column-reverse; gap:7px; z-index:99;
    pointer-events:none;
  }
  .toast{
    background:rgba(74,53,32,.94); color:#fff7e8; padding:9px 16px;
    border-radius:22px; font-size:13px; font-weight:600;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
    animation:toastIn .25s ease-out; max-width:90vw; text-align:center;
  }
  .toast.hide{animation:toastOut .4s ease-in forwards;}
  .toast-pest{background:rgba(197,40,40,.94);}
  .toast-gold{background:rgba(199,140,30,.95);}
  .toast-level{background:linear-gradient(90deg,rgba(124,179,66,.96),rgba(85,139,47,.96));}
  .toast-achieve{background:linear-gradient(90deg,rgba(233,138,59,.96),rgba(224,154,42,.96));}
  .toast-weather{background:rgba(60,110,170,.94);}
  @keyframes toastIn{from{opacity:0; transform:translateY(12px);} to{opacity:1;}}
  @keyframes toastOut{to{opacity:0; transform:translateY(8px);}}

  @media (max-width:780px){
    main{flex-direction:column;}
    .side{width:auto; height:240px; flex-direction:row;}
    .panel{flex:1;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <b>暖阳菜园</b>
      <small>种菜 · 等熟 · 收获 · 致富</small>
    </div>
    <div class="stat"><span class="coin"></span><span class="gold-num" id="gold">0</span></div>
    <div class="stat"><span class="lv-badge" id="level">1</span>
      <div class="xp-wrap">
        <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
        <div class="xp-text" id="xpText">0 / 20</div>
      </div>
    </div>
    <div class="weather-tag w-sunny" id="weatherTag"><span class="w-icon"></span><span id="weatherName">晴空万里</span></div>
    <button class="reset-btn" id="batchBtn">一键照料</button>
    <button class="reset-btn" id="resetBtn">重置存档</button>
  </header>

  <main>
    <div class="stage">
      <canvas id="farm" width="720" height="560"></canvas>
      <div id="floatLayer"></div>
    </div>
    <aside class="side">
      <div class="panel" style="flex:1.4;">
        <div class="panel-title"><b>种子商店</b><span class="cnt">点一下选种</span></div>
        <div id="shopList"></div>
        <div class="shop-hint">选好种子 → 点空地播种 → 熟了点击收获。双击菜地可批量播种 / 收获，离线时会自动补种并扣除种子成本。</div>
      </div>
      <div class="panel" style="flex:1;">
        <div class="panel-title"><b>成就</b><span class="cnt" id="achCount">0/9</span></div>
        <div id="achBox"></div>
      </div>
    </aside>
  </main>

  <footer class="logbar">
    <div class="log-title">菜园日志</div>
    <div id="logBox"></div>
  </footer>
</div>
<div id="toasts"></div>

<script>
(function(){
  'use strict';

  /* ============ 配置 ============ */
  var MAX_LEVEL = 15;
  var SAVE_KEY = 'warm_farm_save_v2';
  var OFFLINE_CAP = 12 * 3600; // 离线最多按 12 小时结算

  // 作物：成本/成熟秒/售价/经验/解锁等级/主色
  var CROPS = [
    { id:'radish',  name:'红萝卜',  desc:'好养活的新手之友',    cost:5,   time:12,  sell:13,  xp:3,  lvl:1,  color:'#e85a5a' },
    { id:'cabbage', name:'翠玉白菜', desc:'扎实靠谱的实惠之选',  cost:16,  time:28,  sell:36,  xp:6,  lvl:1,  color:'#7cb342' },
    { id:'berry',   name:'野草莓',  desc:'酸甜可口小有赚头',    cost:45,  time:55,  sell:96,  xp:12, lvl:3,  color:'#e53935' },
    { id:'melon',   name:'翠皮西瓜', desc:'夏天就该抱个西瓜',    cost:110, time:110, sell:235, xp:22, lvl:5,  color:'#43a047' },
    { id:'pumpkin', name:'金贝南瓜', desc:'圆滚滚的金色疙瘩',    cost:260, time:220, sell:560, xp:42, lvl:8,  color:'#fb8c00' },
    { id:'lingzhi', name:'紫云灵芝', desc:'传说中的修仙仙草',    cost:850, time:560, sell:1950,xp:90, lvl:12, color:'#8e24aa' }
  ];
  var CROP_MAP = {};
  CROPS.forEach(function(c){ CROP_MAP[c.id] = c; });

  // 9 块地：索引 -> 解锁所需等级（前 4 块开局就有）
  var PLOT_UNLOCK = [1,1,1,1, 4,6,8,10,12];

  var ACHIEVEMENTS = [
    { id:'first',     name:'第一桶金',  desc:'完成第一次收获' },
    { id:'saver',     name:'小有积蓄',  desc:'累计赚到 500 金币' },
    { id:'rich',      name:'富甲一方',  desc:'累计赚到 6000 金币' },
    { id:'allcrops',  name:'百菜齐放',  desc:'收获过全部 6 种作物' },
    { id:'hardwork',  name:'勤劳双手',  desc:'累计收获 100 次' },
    { id:'crazy',     name:'种菜狂魔',  desc:'累计收获 500 次' },
    { id:'green',     name:'绿手指',    desc:'等级达到 12 级' },
    { id:'full',      name:'满园春色',  desc:'解锁全部 9 块地' },
    { id:'lingzhi10', name:'修仙有道',  desc:'收获 10 株灵芝' }
  ];

  /* ============ DOM 小工具 ============ */
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt != null) e.textContent = txt;
    return e;
  }

  /* ============ 音效（Web Audio 现场合成） ============ */
  var audio = {
    ctx: null,
    ensure: function(){
      if(!this.ctx){
        try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ this.ctx = null; }
      }
      if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep: function(freq, dur, type, vol, delay){
      if(!this.ctx) return;
      var t0 = this.ctx.currentTime + (delay || 0);
      var osc = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol || 0.18, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    },
    play: function(kind){
      this.ensure();
      if(!this.ctx) return;
      if(kind === 'plant'){ this.beep(330,0.12,'triangle',0.18,0); this.beep(495,0.10,'triangle',0.14,0.06); }
      else if(kind === 'harvest'){ this.beep(523,0.10,'square',0.15,0); this.beep(659,0.10,'square',0.15,0.08); this.beep(784,0.16,'square',0.15,0.16); }
      else if(kind === 'levelup'){ this.beep(523,0.12,'sawtooth',0.13,0); this.beep(659,0.12,'sawtooth',0.13,0.1); this.beep(784,0.12,'sawtooth',0.13,0.2); this.beep(1047,0.24,'sawtooth',0.15,0.3); }
      else if(kind === 'pest'){ this.beep(880,0.05,'square',0.18,0); this.beep(440,0.05,'square',0.16,0.05); this.beep(220,0.10,'sawtooth',0.15,0.10); }
      else if(kind === 'error'){ this.beep(180,0.16,'sawtooth',0.16,0); }
      else if(kind === 'achieve'){ this.beep(660,0.10,'triangle',0.15,0); this.beep(880,0.10,'triangle',0.15,0.09); this.beep(1175,0.22,'triangle',0.15,0.18); }
      else if(kind === 'weather'){ this.beep(440,0.18,'sine',0.11,0); this.beep(587,0.20,'sine',0.10,0.1); }
    }
  };

  /* ============ 状态 ============ */
  function newState(){
    var plots = [];
    for(var i = 0; i < 9; i++){
      plots.push({ locked: i >= 4, crop: null, growth: 0, pest: false, pestAt: 0 });
    }
    return {
      gold: 60, level: 1, xp: 0,
      plots: plots, selected: 'radish',
      weather: { type:'sunny', endTime: 0 },
      nextPestAt: Date.now() + 35000,
      stats: { harvested:0, earned:0, cropTypes:{} },
      ach: {}, lastSeen: Date.now()
    };
  }
  var state = newState();

  /* ============ 存档 ============ */
  function save(){
    try{
      state.lastSeen = Date.now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      var s = JSON.parse(raw);
      if(!s || !s.plots) return false;
      var base = newState();
      for(var k in base){ if(s[k] !== undefined && s[k] !== null) state[k] = s[k]; }
      if(!state.plots || state.plots.length !== 9) state.plots = base.plots;
      if(!state.stats) state.stats = base.stats;
      if(!state.ach) state.ach = {};
      if(!state.weather) state.weather = base.weather;
      if(!state.selected || !CROP_MAP[state.selected]) state.selected = 'radish';
      state.gold = Math.max(0, Number(state.gold) || 0);
      state.level = Math.max(1, Math.min(MAX_LEVEL, Math.floor(Number(state.level) || 1)));
      state.xp = Math.max(0, Number(state.xp) || 0);
      state.stats.harvested = Math.max(0, Number(state.stats.harvested) || 0);
      state.stats.earned = Math.max(0, Number(state.stats.earned) || 0);
      if(!state.stats.cropTypes || typeof state.stats.cropTypes !== 'object') state.stats.cropTypes = {};
      state.plots.forEach(function(p, i){
        if(!p || typeof p !== 'object') state.plots[i] = base.plots[i];
        else{
          p.locked = PLOT_UNLOCK[i] > state.level;
          if(p.crop !== null && !CROP_MAP[p.crop]){ p.crop = null; p.growth = 0; }
          p.growth = Math.max(0, Number(p.growth) || 0);
          p.pest = Boolean(p.pest);
        }
      });
      return true;
    }catch(e){ return false; }
  }

  /* ============ 等级 ============ */
  function xpToNext(lv){ return 20 * lv * lv; }
  function gainXp(n){
    state.xp += n;
    while(state.level < MAX_LEVEL && state.xp >= xpToNext(state.level)){
      state.xp -= xpToNext(state.level);
      state.level++;
      onLevelUp();
    }
    if(state.level >= MAX_LEVEL) state.xp = Math.min(state.xp, xpToNext(MAX_LEVEL));
  }
  function onLevelUp(){
    audio.play('levelup');
    var msg = '升级！现在 ' + state.level + ' 级';
    CROPS.forEach(function(c){ if(c.lvl === state.level) msg += '，解锁了 ' + c.name; });
    var unlockedPlot = false;
    state.plots.forEach(function(p, i){
      if(p.locked && PLOT_UNLOCK[i] <= state.level){ p.locked = false; unlockedPlot = true; }
    });
    if(unlockedPlot) msg += '，新开垦了一块地';
    toast(msg, 'level');
  }
  // 静默升级（离线结算用，不刷屏）
  function silentLevelUp(xp){
    state.xp += xp;
    while(state.level < MAX_LEVEL && state.xp >= xpToNext(state.level)){
      state.xp -= xpToNext(state.level);
      state.level++;
      state.plots.forEach(function(p, i){
        if(p.locked && PLOT_UNLOCK[i] <= state.level) p.locked = false;
      });
    }
    if(state.level >= MAX_LEVEL) state.xp = Math.min(state.xp, xpToNext(MAX_LEVEL));
  }

  /* ============ 离线结算（按阳光速率补算收益） ============ */
  function settleOffline(elapsed){
    if(elapsed <= 0) return;
    var sec = Math.min(elapsed, OFFLINE_CAP);
    var earnedGold = 0, earnedXp = 0, harvestedCount = 0;
    state.plots.forEach(function(p){
      if(p.locked || p.crop === null) return;
      var crop = CROP_MAP[p.crop];
      var total = p.growth + sec;          // 离线按 1.0 阳光速率生长
      var cycles = Math.floor(total / crop.time);
      var rem = total - cycles * crop.time;
      if(cycles > 0){
        var gross = crop.sell * cycles;
        var seedCost = crop.cost * cycles;
        earnedGold += gross - seedCost;
        earnedXp += crop.xp * cycles;
        harvestedCount += cycles;
        state.stats.harvested += cycles;
        state.stats.earned += gross;
        state.stats.cropTypes[crop.id] = (state.stats.cropTypes[crop.id] || 0) + cycles;
      }
      p.growth = Math.min(crop.time, rem);
      p.pest = false;
    });
    if(earnedGold > 0){
      state.gold += earnedGold;
      silentLevelUp(earnedXp);
      var hours = (sec / 3600).toFixed(1);
      toast('离线 ' + hours + ' 小时：+' + earnedGold + ' 金币，' + harvestedCount + ' 次收获', 'gold');
    }
  }

  /* ============ 玩法动作 ============ */
  function cropUnlocked(crop){ return state.level >= crop.lvl; }
  function selectCrop(id){
    var crop = CROP_MAP[id];
    if(!crop) return;
    if(!cropUnlocked(crop)){ toast('等级不够，' + crop.name + ' 需要 ' + crop.lvl + ' 级', 'warn'); audio.play('error'); return; }
    state.selected = id;
    updateShop();
  }
  function plant(idx){
    var p = state.plots[idx];
    if(p.locked || p.crop !== null) return;
    var crop = CROP_MAP[state.selected];
    if(!cropUnlocked(crop)){ toast('当前选中的作物未解锁', 'warn'); audio.play('error'); return; }
    if(state.gold < crop.cost){ toast('金币不够，买不起 ' + crop.name + ' 种子', 'warn'); audio.play('error'); return; }
    state.gold -= crop.cost;
    p.crop = crop.id; p.growth = 0; p.pest = false;
    audio.play('plant');
    updateStatus();
  }
  function harvest(idx){
    var p = state.plots[idx];
    if(p.crop === null) return;
    var crop = CROP_MAP[p.crop];
    if(p.growth < crop.time){ toast(crop.name + ' 还没熟，再等等', 'info'); return; }
    var bonus = (state.weather.type === 'festival') ? 2 : 1;
    var earn = crop.sell * bonus;
    state.gold += earn;
    state.stats.harvested++;
    state.stats.earned += earn;
    state.stats.cropTypes[crop.id] = (state.stats.cropTypes[crop.id] || 0) + 1;
    gainXp(crop.xp);
    audio.play('harvest');
    floatText(idx, '+' + earn + (bonus > 1 ? ' x2' : ''));
    p.crop = null; p.growth = 0; p.pest = false;
    checkAchievements();
    updateStatus();
  }
  function removePest(idx){
    var p = state.plots[idx];
    if(!p.pest) return;
    p.pest = false;
    audio.play('pest');
    gainXp(2);
    floatText(idx, '除虫 +2经验');
    updateStatus();
  }
  function clickPlot(idx){
    var p = state.plots[idx];
    if(p.locked){ toast('这块地还没解锁', 'warn'); audio.play('error'); return; }
    if(p.pest){ removePest(idx); return; }
    if(p.crop === null){ plant(idx); return; }
    var crop = CROP_MAP[p.crop];
    if(p.growth >= crop.time){ harvest(idx); return; }
    toast(crop.name + ' 生长中 ' + Math.floor(p.growth / crop.time * 100) + '%', 'info');
  }

  function batchAction(){
    var harvested = 0, planted = 0, cleared = 0;
    state.plots.forEach(function(p, i){
      if(p.locked) return;
      if(p.pest){ removePest(i); cleared++; return; }
      if(p.crop !== null && p.growth >= CROP_MAP[p.crop].time){ harvest(i); harvested++; }
    });
    state.plots.forEach(function(p, i){
      if(p.locked || p.crop !== null) return;
      var crop = CROP_MAP[state.selected];
      if(crop && cropUnlocked(crop) && state.gold >= crop.cost){ plant(i); planted++; }
    });
    if(harvested || planted || cleared){
      toast('批量完成：收获 '+harvested+'，播种 '+planted+'，除虫 '+cleared, 'gold');
      save();
    }
  }

  /* ============ 天气 ============ */
  var WEATHER_LIST = [
    { type:'sunny',    name:'晴空万里', rate:1.0, weight:3 },
    { type:'rain',     name:'细雨绵绵', rate:1.8, weight:2 },
    { type:'drought',  name:'烈日干旱', rate:0.5, weight:1 },
    { type:'festival', name:'丰收佳节', rate:1.0, weight:2 }
  ];
  function weatherName(t){ for(var i = 0; i < WEATHER_LIST.length; i++) if(WEATHER_LIST[i].type === t) return WEATHER_LIST[i].name; return ''; }
  function weatherRate(){ for(var i = 0; i < WEATHER_LIST.length; i++) if(WEATHER_LIST[i].type === state.weather.type) return WEATHER_LIST[i].rate; return 1.0; }
  function rollWeather(){
    var total = 0; WEATHER_LIST.forEach(function(w){ total += w.weight; });
    var r = Math.random() * total, acc = 0, pick = WEATHER_LIST[0];
    for(var i = 0; i < WEATHER_LIST.length; i++){ acc += WEATHER_LIST[i].weight; if(r <= acc){ pick = WEATHER_LIST[i]; break; } }
    // 别让干旱连续出现太多次，太挫败
    if(pick.type === 'drought' && state.weather.type === 'drought') pick = WEATHER_LIST[0];
    state.weather.type = pick.type;
    state.weather.endTime = Date.now() + 20000 + Math.random() * 15000;
    var msg = '';
    if(pick.type === 'sunny') msg = '阳光正好，菜们长势喜人';
    else if(pick.type === 'rain') msg = '淅淅沥沥下起小雨，作物喝得正欢（生长加速）';
    else if(pick.type === 'drought') msg = '太阳太毒了，菜有点蔫（生长减慢）';
    else if(pick.type === 'festival') msg = '丰收节到啦！现在卖菜双倍金币';
    toast(msg, 'weather');
    audio.play('weather');
  }

  /* ============ 虫害 ============ */
  function maybePest(){
    if(Date.now() < state.nextPestAt) return;
    state.nextPestAt = Date.now() + 24000 + Math.random() * 22000;
    var cand = [];
    state.plots.forEach(function(p, i){
      if(!p.locked && p.crop !== null && !p.pest){
        var crop = CROP_MAP[p.crop];
        if(p.growth < crop.time) cand.push(i); // 只骚扰没熟的
      }
    });
    if(cand.length === 0) return;
    var idx = cand[Math.floor(Math.random() * cand.length)];
    state.plots[idx].pest = true;
    state.plots[idx].pestAt = Date.now();
    toast('害虫来袭！快点击生虫的菜地除虫', 'pest');
  }

  /* ============ 主 tick ============ */
  function tick(dt){
    var rate = weatherRate();
    var now = Date.now();
    state.plots.forEach(function(p){
      if(p.crop === null || p.locked) return;
      if(p.pest){
        if(now - p.pestAt > 45000){ // 半分钟不管就枯萎
          var crop = CROP_MAP[p.crop];
          toast(crop.name + ' 被虫啃光了…', 'pest');
          p.crop = null; p.growth = 0; p.pest = false;
        }
        return; // 生虫期间暂停生长
      }
      var crop = CROP_MAP[p.crop];
      if(p.growth < crop.time){
        p.growth += dt * rate;
        if(p.growth > crop.time) p.growth = crop.time;
      }
    });
    if(now > state.weather.endTime) rollWeather();
    maybePest();
  }

  /* ============ 成就 ============ */
  function achieveMet(a){
    var s = state;
    if(a.id === 'first') return s.stats.harvested >= 1;
    if(a.id === 'saver') return s.stats.earned >= 500;
    if(a.id === 'rich') return s.stats.earned >= 6000;
    if(a.id === 'allcrops') return Object.keys(s.stats.cropTypes).length >= CROPS.length;
    if(a.id === 'hardwork') return s.stats.harvested >= 100;
    if(a.id === 'crazy') return s.stats.harvested >= 500;
    if(a.id === 'green') return s.level >= 12;
    if(a.id === 'full') return s.plots.every(function(p){ return !p.locked; });
    if(a.id === 'lingzhi10') return (s.stats.cropTypes['lingzhi'] || 0) >= 10;
    return false;
  }
  function checkAchievements(){
    ACHIEVEMENTS.forEach(function(a){
      if(state.ach[a.id]) return;
      if(achieveMet(a)){
        state.ach[a.id] = true;
        audio.play('achieve');
        toast('成就达成：' + a.name, 'achieve');
        renderAchievements();
      }
    });
  }

  /* ============ UI 反馈 ============ */
  function toast(msg, kind){
    var t = el('div', 'toast toast-' + (kind || 'info'));
    t.textContent = msg;
    $('toasts').appendChild(t);
    setTimeout(function(){ t.classList.add('hide'); }, 2600);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3200);
    log(msg);
  }
  function log(msg){
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    var li = el('div', 'log-line');
    li.textContent = hh + ':' + mm + '  ' + msg;
    var box = $('logBox');
    box.insertBefore(li, box.firstChild);
    while(box.childNodes.length > 40) box.removeChild(box.lastChild);
  }
  function floatText(idx, text){
    var r = plotRects[idx]; if(!r) return;
    var cvRect = cv.getBoundingClientRect();
    var scaleX = cvRect.width / CV_W, scaleY = cvRect.height / CV_H;
    var node = el('div', 'float-text');
    node.textContent = text;
    node.style.left = ((r.x + r.w / 2) * scaleX) + 'px';
    node.style.top = ((r.y + 14) * scaleY) + 'px';
    $('floatLayer').appendChild(node);
    setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 1100);
  }

  /* ============ UI 更新 ============ */
  function updateStatus(){
    $('gold').textContent = state.gold;
    $('level').textContent = state.level;
    var need = xpToNext(state.level);
    $('xpText').textContent = state.level >= MAX_LEVEL ? '满级' : (state.xp + ' / ' + need);
    $('xpFill').style.width = (state.level >= MAX_LEVEL ? 100 : Math.min(100, state.xp / need * 100)) + '%';
    var wt = $('weatherTag');
    wt.className = 'weather-tag w-' + state.weather.type;
    $('weatherName').textContent = weatherName(state.weather.type);
  }
  function updateShop(){
    var items = $('shopList').children;
    for(var i = 0; i < items.length; i++){
      var crop = CROPS[i];
      var item = items[i];
      var unlocked = cropUnlocked(crop);
      var afford = state.gold >= crop.cost;
      item.classList.toggle('locked', !unlocked);
      item.classList.toggle('selected', state.selected === crop.id);
      item.classList.toggle('disabled', unlocked && !afford);
    }
  }
  function renderAchievements(){
    var box = $('achBox');
    while(box.firstChild) box.removeChild(box.firstChild);
    ACHIEVEMENTS.forEach(function(a){
      var got = !!state.ach[a.id];
      var node = el('div', 'ach' + (got ? ' got' : ''));
      node.appendChild(el('div', 'ach-name', (got ? '★ ' : '☆ ') + a.name));
      node.appendChild(el('div', 'ach-desc', a.desc));
      box.appendChild(node);
    });
    $('achCount').textContent = Object.keys(state.ach).length + '/' + ACHIEVEMENTS.length;
  }

  /* ============ 商店构建 ============ */
  function buildShop(){
    var list = $('shopList');
    while(list.firstChild) list.removeChild(list.firstChild);
    CROPS.forEach(function(crop){
      var item = el('button', 'shop-item');
      item.title = crop.desc;
      var icon = document.createElement('canvas');
      icon.width = 42; icon.height = 42;
      icon.className = 'si-icon';
      drawCropIcon(icon.getContext('2d'), crop);
      item.appendChild(icon);

      var info = el('div', 'si-info');
      var row1 = el('div', 'si-row');
      row1.appendChild(el('span', 'si-name', crop.name));
      var lock = el('span', 'si-lock');
      lock.textContent = crop.lvl > 1 ? (crop.lvl + '级') : '';
      if(crop.lvl > 1) row1.appendChild(lock);
      info.appendChild(row1);

      var row2 = el('div', 'si-row');
      row2.appendChild(el('span', 'si-cost', crop.cost + '金'));
      row2.appendChild(el('span', 'si-dot', '·'));
      row2.appendChild(el('span', 'si-time', crop.time + '秒'));
      row2.appendChild(el('span', 'si-dot', '·'));
      row2.appendChild(el('span', 'si-sell', '售' + crop.sell));
      info.appendChild(row2);

      info.appendChild(el('div', 'si-desc', crop.desc));
      item.appendChild(info);

      (function(id){ item.addEventListener('click', function(){ selectCrop(id); }); })(crop.id);
      list.appendChild(item);
    });
  }

  /* ============ 画布 ============ */
  var cv = $('farm');
  var ctx = cv.getContext('2d');
  var CV_W = 720, CV_H = 560;
  var plotRects = [];
  var hoverPlot = -1;

  function resizeCanvas(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = CV_W * dpr;
    cv.height = CV_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layoutPlots();
  }
  function layoutPlots(){
    plotRects = [];
    var cols = 3, rows = 3, gap = 18;
    var padX = 40, padTop = 150, padBottom = 30;
    var gridW = CV_W - padX * 2;
    var gridH = CV_H - padTop - padBottom;
    var pw = (gridW - gap * (cols - 1)) / cols;
    var ph = (gridH - gap * (rows - 1)) / rows;
    for(var r = 0; r < rows; r++){
      for(var c = 0; c < cols; c++){
        plotRects.push({
          x: padX + c * (pw + gap),
          y: padTop + r * (ph + gap),
          w: pw, h: ph
        });
      }
    }
  }

  function roundRect(c, x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function leaf(c, x, y, size, color){
    c.fillStyle = color;
    c.beginPath();
    c.ellipse(x, y, size * 0.5, size, 0, 0, Math.PI * 2);
    c.fill();
  }

  /* —— 背景：太阳 / 远山 —— */
  function drawSun(time){
    var cx = CV_W - 92, cy = 72, R = 32;
    var glow = ctx.createRadialGradient(cx, cy, R * 0.4, cx, cy, R * 2.3);
    glow.addColorStop(0, 'rgba(255,221,130,0.85)');
    glow.addColorStop(1, 'rgba(255,221,130,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, R * 2.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd14d';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,205,90,0.55)'; ctx.lineWidth = 3;
    for(var i = 0; i < 8; i++){
      var a = i / 8 * Math.PI * 2 + time * 0.25;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (R + 7), cy + Math.sin(a) * (R + 7));
      ctx.lineTo(cx + Math.cos(a) * (R + 15), cy + Math.sin(a) * (R + 15));
      ctx.stroke();
    }
  }
  function drawHills(){
    var baseY = CV_H * 0.47;
    ctx.fillStyle = '#c79a6b';
    ctx.beginPath();
    ctx.moveTo(0, baseY);
    ctx.quadraticCurveTo(120, baseY - 42, 240, baseY);
    ctx.quadraticCurveTo(360, baseY - 58, 480, baseY);
    ctx.quadraticCurveTo(600, baseY - 36, CV_W, baseY);
    ctx.lineTo(CV_W, baseY + 24); ctx.lineTo(0, baseY + 24);
    ctx.closePath(); ctx.fill();
  }

  /* —— 地块绘制 —— */
  function drawSoilTexture(r){
    ctx.strokeStyle = 'rgba(50,30,15,0.4)'; ctx.lineWidth = 2;
    for(var i = 1; i < 4; i++){
      var yy = r.y + r.h * i / 4;
      ctx.beginPath(); ctx.moveTo(r.x + 10, yy); ctx.lineTo(r.x + r.w - 10, yy); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,230,180,0.16)';
    for(var k = 0; k < 12; k++){
      var px = r.x + 12 + ((k * 53) % (r.w - 24));
      var py = r.y + 10 + ((k * 31) % (r.h - 20));
      ctx.beginPath(); ctx.arc(px, py, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawLock(r, i){
    var cx = r.x + r.w / 2, cy = r.y + r.h / 2 - 8;
    ctx.strokeStyle = 'rgba(255,250,235,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy - 9, 8, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = 'rgba(255,250,235,0.9)';
    roundRect(ctx, cx - 13, cy - 7, 26, 20, 4); ctx.fill();
    ctx.fillStyle = '#4a2d15';
    ctx.beginPath(); ctx.arc(cx, cy - 1, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,250,235,0.9)';
    ctx.font = 'bold 12px "PingFang SC",system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('LV ' + PLOT_UNLOCK[i] + ' 解锁', cx, r.y + r.h - 12);
  }
  function drawProgress(r, g, mature){
    var bw = r.w - 24, bh = 6, bx = r.x + 12, by = r.y + r.h - 13;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(ctx, bx, by, bw, bh, 3); ctx.fill();
    var fw = bw * Math.min(1, g);
    if(fw > 1){
      ctx.fillStyle = mature ? '#ffd24d' : '#8bc34a';
      roundRect(ctx, bx, by, fw, bh, 3); ctx.fill();
    }
  }
  function drawBug(r, time){
    var cx = r.x + r.w * 0.72, cy = r.y + r.h * 0.32;
    var wig = Math.sin(time * 9) * 2;
    ctx.save(); ctx.translate(cx + wig, cy);
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c62828';
    ctx.beginPath(); ctx.arc(-3, -3, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -3, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(229,57,53,' + (0.4 + 0.3 * Math.sin(time * 7)) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.stroke();
  }
  function drawEmptyHint(r){
    var crop = CROP_MAP[state.selected];
    if(!cropUnlocked(crop) || state.gold < crop.cost) return;
    var pulse = 0.35 + 0.2 * Math.sin(performance.now() / 300);
    ctx.strokeStyle = 'rgba(255,255,255,' + pulse + ')'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    roundRect(ctx, r.x + 8, r.y + 8, r.w - 16, r.h - 16, 10);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = 'bold 24px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('+', r.x + r.w / 2, r.y + r.h / 2 - 6);
  }

  /* —— 作物绘制（局部坐标：土面在 y=0，向上为负） —— */
  var FRUIT = {
    radish: function(c, g){
      var stemH = 6 + g * 16;
      if(g > 0.1){
        var lf = Math.min(1, (g - 0.1) / 0.5);
        leaf(c, -5, -stemH + 2, 11 * lf, '#9ccc65');
        leaf(c, 5, -stemH, 11 * lf, '#7cb342');
        leaf(c, 0, -stemH - 4, 12 * lf, '#aed581');
      }
      if(g > 0.35){
        var r = (g - 0.35) / 0.65;
        var R = 4 + r * 13;
        c.fillStyle = '#e85a5a';
        c.beginPath(); c.ellipse(0, 2, R, R * 1.15, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.28)';
        c.beginPath(); c.ellipse(-R * 0.3, -R * 0.1, R * 0.3, R * 0.4, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#b03020';
        c.beginPath(); c.moveTo(-2, 2 + R); c.lineTo(2, 2 + R); c.lineTo(0, 2 + R + 7); c.closePath(); c.fill();
      }
    },
    cabbage: function(c, g){
      var s = 4 + g * 18;
      c.fillStyle = '#9ccc65';
      for(var i = 0; i < 5; i++){
        var a = i / 5 * Math.PI * 2;
        c.save(); c.rotate(a);
        c.beginPath(); c.ellipse(0, -s * 0.55, s * 0.5, s * 0.95, 0, 0, Math.PI * 2); c.fill();
        c.restore();
      }
      if(g > 0.5){
        var cs = (g - 0.5) * 2 * 9;
        c.fillStyle = '#cddc39';
        c.beginPath(); c.arc(0, -s * 0.15, cs, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#dce775';
        c.beginPath(); c.arc(-cs * 0.3, -s * 0.25, cs * 0.4, 0, Math.PI * 2); c.fill();
      }
    },
    berry: function(c, g){
      var stemH = 6 + g * 16;
      c.strokeStyle = '#558b2f'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -stemH); c.stroke();
      if(g > 0.2){ leaf(c, -5, -stemH * 0.55, 8, '#7cb342'); leaf(c, 5, -stemH * 0.35, 7, '#7cb342'); }
      if(g > 0.4 && g < 0.65){
        c.fillStyle = '#fffde7';
        for(var k = 0; k < 5; k++){
          var a = k / 5 * Math.PI * 2;
          c.beginPath(); c.ellipse(Math.cos(a) * 3, -stemH + Math.sin(a) * 3, 2.6, 2.6, 0, 0, Math.PI * 2); c.fill();
        }
        c.fillStyle = '#ffc107'; c.beginPath(); c.arc(0, -stemH, 1.6, 0, Math.PI * 2); c.fill();
      }
      if(g > 0.6){
        var r = (g - 0.6) / 0.4;
        var R = 4 + r * 11;
        var top = -stemH - R;
        c.fillStyle = '#e53935';
        c.beginPath();
        c.moveTo(0, top);
        c.bezierCurveTo(R, top + R * 0.5, R, top + R * 1.7, 0, top + R * 1.9);
        c.bezierCurveTo(-R, top + R * 1.7, -R, top + R * 0.5, 0, top);
        c.fill();
        c.fillStyle = '#fff59d';
        for(var s = 0; s < 5; s++){
          c.beginPath(); c.arc((s - 2) * 2.2, top + R * 0.9, 0.9, 0, Math.PI * 2); c.fill();
        }
        c.fillStyle = '#43a047';
        c.beginPath(); c.moveTo(0, top); c.lineTo(-5, top - 3); c.lineTo(-1, top); c.lineTo(0, top - 4); c.lineTo(1, top); c.lineTo(5, top - 3); c.closePath(); c.fill();
      }
    },
    melon: function(c, g){
      var stemH = 6 + g * 14;
      c.strokeStyle = '#558b2f'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -stemH); c.stroke();
      leaf(c, -6, -stemH * 0.6, 10, '#7cb342');
      leaf(c, 6, -stemH * 0.4, 8, '#7cb342');
      if(g > 0.4){
        var r = (g - 0.4) / 0.6;
        var R = 6 + r * 16;
        var cy = -stemH - R * 0.55;
        c.fillStyle = '#43a047';
        c.beginPath(); c.arc(0, cy, R, 0, Math.PI * 2); c.fill();
        c.strokeStyle = 'rgba(30,80,40,0.75)'; c.lineWidth = 2.5;
        for(var j = -2; j <= 2; j++){
          var sx = j * R * 0.3;
          c.beginPath();
          c.moveTo(sx, cy - R * 0.9);
          c.quadraticCurveTo(sx * 1.15, cy, sx, cy + R * 0.4);
          c.stroke();
        }
        c.fillStyle = 'rgba(255,255,255,0.22)';
        c.beginPath(); c.arc(-R * 0.3, cy - R * 0.3, R * 0.28, 0, Math.PI * 2); c.fill();
      }
    },
    pumpkin: function(c, g){
      var R = 5 + g * 20;
      var cy = -R * 0.7;
      c.fillStyle = '#6d4c41';
      c.fillRect(-3, cy - R - 6, 6, 8);
      c.fillStyle = '#fb8c00';
      c.beginPath(); c.ellipse(0, cy, R * 0.95, R * 0.7, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#e65100'; c.lineWidth = 2.5;
      for(var j = -1; j <= 1; j++){
        var sx = j * R * 0.42;
        c.beginPath();
        c.moveTo(sx, cy - R * 0.62);
        c.quadraticCurveTo(sx * 1.35, cy, sx, cy + R * 0.6);
        c.stroke();
      }
      c.fillStyle = 'rgba(255,255,255,0.25)';
      c.beginPath(); c.arc(-R * 0.35, cy - R * 0.3, R * 0.25, 0, Math.PI * 2); c.fill();
    },
    lingzhi: function(c, g, time, mature){
      var R = 5 + g * 20;
      var cy = -R * 0.2;
      c.fillStyle = '#d7c4a3';
      c.fillRect(-R * 0.18, -R * 0.4, R * 0.36, R * 0.6);
      c.fillStyle = '#8e24aa';
      c.beginPath();
      c.ellipse(0, cy - R * 0.3, R * 0.95, R * 0.55, 0, Math.PI, 0);
      c.fill();
      c.lineWidth = 2; c.strokeStyle = '#b388ff'; c.stroke();
      c.fillStyle = '#efe1c9';
      c.beginPath(); c.ellipse(0, cy - R * 0.05, R * 0.92, R * 0.12, 0, 0, Math.PI * 2); c.fill();
      // 一圈年轮
      c.strokeStyle = 'rgba(120,60,140,0.5)'; c.lineWidth = 1.2;
      c.beginPath(); c.ellipse(0, cy - R * 0.3, R * 0.6, R * 0.32, 0, Math.PI, 0); c.stroke();
      if(mature){
        for(var k = 0; k < 4; k++){
          var a = time * 1.2 + k * 1.6;
          c.fillStyle = 'rgba(230,200,255,0.85)';
          c.beginPath(); c.arc(Math.cos(a) * R * 0.5, cy - R * 0.4 + Math.sin(a) * R * 0.18, 1.5, 0, Math.PI * 2); c.fill();
        }
      }
    }
  };

  function drawCrop(c, crop, g, cx, cy, time, mature){
    c.save();
    c.translate(cx, cy);
    var bob = mature ? Math.sin(time * 3.2) * 2 : 0;
    c.translate(0, bob);
    if(mature){
      var gl = c.createRadialGradient(0, -20, 4, 0, -20, 56);
      gl.addColorStop(0, 'rgba(255,225,120,0.55)');
      gl.addColorStop(1, 'rgba(255,225,120,0)');
      c.fillStyle = gl;
      c.beginPath(); c.arc(0, -20, 56, 0, Math.PI * 2); c.fill();
    }
    FRUIT[crop.id](c, g, time, mature);
    c.restore();
  }

  function drawPlot(i, time){
    var r = plotRects[i];
    var p = state.plots[i];
    roundRect(ctx, r.x, r.y, r.w, r.h, 14);
    var sg = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    if(p.locked){ sg.addColorStop(0, '#9a8a72'); sg.addColorStop(1, '#7d6e58'); }
    else{ sg.addColorStop(0, '#6b4423'); sg.addColorStop(1, '#4a2d15'); }
    ctx.fillStyle = sg; ctx.fill();
    if(!p.locked) drawSoilTexture(r);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,235,180,0.25)';
    roundRect(ctx, r.x + 1, r.y + 1, r.w - 2, r.h - 2, 13); ctx.stroke();

    if(i === hoverPlot){
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      roundRect(ctx, r.x + 1, r.y + 1, r.w - 2, r.h - 2, 13); ctx.stroke();
    }

    if(p.locked){ drawLock(r, i); return; }

    if(p.crop !== null){
      var crop = CROP_MAP[p.crop];
      var g = Math.min(1, p.growth / crop.time);
      var mature = p.growth >= crop.time;
      var cx = r.x + r.w / 2, cy = r.y + r.h * 0.7;
      drawCrop(ctx, crop, g, cx, cy, time, mature);
      drawProgress(r, g, mature);
      if(p.pest) drawBug(r, time);
      if(mature){
        // 成熟提示：跳动的金色小三角
        var ay = r.y + 10 + Math.sin(time * 5) * 2;
        ctx.fillStyle = '#ffd24d';
        ctx.beginPath();
        ctx.moveTo(r.x + r.w / 2, ay + 7);
        ctx.lineTo(r.x + r.w / 2 - 5, ay);
        ctx.lineTo(r.x + r.w / 2 + 5, ay);
        ctx.closePath(); ctx.fill();
      }
    }else{
      drawEmptyHint(r);
    }
  }

  function drawWeatherOverlay(time){
    var t = state.weather.type;
    if(t === 'rain'){
      ctx.strokeStyle = 'rgba(140,190,235,0.55)'; ctx.lineWidth = 1.5;
      for(var i = 0; i < 70; i++){
        var seed = (i * 97) % 997;
        var x = (seed * 37) % CV_W;
        var y = (seed * 53 + time * 480) % (CV_H + 20);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 12); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(80,120,180,0.08)'; ctx.fillRect(0, 0, CV_W, CV_H);
    }else if(t === 'drought'){
      ctx.fillStyle = 'rgba(255,130,50,0.09)'; ctx.fillRect(0, 0, CV_W, CV_H);
      ctx.strokeStyle = 'rgba(255,180,100,0.25)'; ctx.lineWidth = 1;
      for(var j = 0; j < 6; j++){
        var yy = (j * 90 + time * 30) % CV_H;
        ctx.beginPath(); ctx.moveTo(0, yy);
        for(var xx = 0; xx <= CV_W; xx += 20) ctx.lineTo(xx, yy + Math.sin(xx * 0.05 + time * 2) * 3);
        ctx.stroke();
      }
    }else if(t === 'festival'){
      var cols = ['#ffd54f', '#ff8a65', '#aed581', '#fff176', '#4fc3f7', '#f48fb1'];
      for(var k = 0; k < 26; k++){
        var sd = k * 131;
        var px = (sd * 17 + time * 70) % CV_W;
        var py = (sd * 29 + time * 140) % CV_H;
        ctx.fillStyle = cols[k % cols.length];
        ctx.save(); ctx.translate(px, py); ctx.rotate(time + k);
        ctx.fillRect(-2.5, -2.5, 5, 5);
        ctx.restore();
      }
    }
  }

  function drawScene(time){
    var sky = ctx.createLinearGradient(0, 0, 0, CV_H * 0.5);
    sky.addColorStop(0, '#ffe7b0'); sky.addColorStop(1, '#ffcf85');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, CV_W, CV_H * 0.5);
    drawSun(time);
    drawHills();
    var ground = ctx.createLinearGradient(0, CV_H * 0.45, 0, CV_H);
    ground.addColorStop(0, '#caa274'); ground.addColorStop(1, '#9c7240');
    ctx.fillStyle = ground; ctx.fillRect(0, CV_H * 0.45, CV_W, CV_H * 0.55);
    for(var i = 0; i < plotRects.length; i++) drawPlot(i, time);
    drawWeatherOverlay(time);
  }

  /* 商店图标 */
  function shade(hex, amt){
    var c = hex.replace('#', '');
    var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    r = Math.max(0, Math.min(255, Math.round(r + 255 * amt)));
    g = Math.max(0, Math.min(255, Math.round(g + 255 * amt)));
    b = Math.max(0, Math.min(255, Math.round(b + 255 * amt)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function drawCropIcon(c, crop){
    c.clearRect(0, 0, 42, 42);
    var bg = c.createRadialGradient(21, 18, 3, 21, 21, 22);
    bg.addColorStop(0, shade(crop.color, 0.25));
    bg.addColorStop(1, shade(crop.color, -0.22));
    c.fillStyle = bg;
    c.beginPath(); c.arc(21, 21, 20, 0, Math.PI * 2); c.fill();
    c.save(); c.translate(21, 32); c.scale(0.62, 0.62);
    FRUIT[crop.id](c, 1, 0, false);
    c.restore();
  }

  /* ============ 输入 ============ */
  function canvasCoord(e){
    var rect = cv.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width * CV_W,
      y: (e.clientY - rect.top) / rect.height * CV_H
    };
  }
  function plotAt(x, y){
    for(var i = 0; i < plotRects.length; i++){
      var r = plotRects[i];
      if(x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }
  cv.addEventListener('mousemove', function(e){
    var p = canvasCoord(e);
    hoverPlot = plotAt(p.x, p.y);
    cv.style.cursor = hoverPlot >= 0 ? 'pointer' : 'default';
  });
  cv.addEventListener('mouseleave', function(){ hoverPlot = -1; });
  cv.addEventListener('click', function(e){
    audio.ensure();
    var p = canvasCoord(e);
    var idx = plotAt(p.x, p.y);
    if(idx >= 0) clickPlot(idx);
  });
  cv.addEventListener('dblclick', function(e){
    e.preventDefault();
    audio.ensure();
    batchAction();
  });
  $('batchBtn').addEventListener('click', function(){
    audio.ensure();
    batchAction();
  });
  // 移动端触摸
  cv.addEventListener('touchstart', function(e){
    if(e.touches.length === 0) return;
    audio.ensure();
    var t = e.touches[0];
    var p = canvasCoord(t);
    var idx = plotAt(p.x, p.y);
    if(idx >= 0){ clickPlot(idx); e.preventDefault(); }
  }, { passive: false });

  $('resetBtn').addEventListener('click', function(){
    if(!window.confirm('确定要清空存档、从头开始种菜吗？')) return;
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    state = newState();
    renderAchievements(); updateStatus(); updateShop();
    toast('已重新开始，加油吧菜农！', 'info');
  });

  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      var gap = (Date.now() - (state.lastSeen || Date.now())) / 1000;
      if(gap > 60){ settleOffline(gap); checkAchievements(); updateStatus(); }
      state.lastSeen = Date.now();
      lastTime = performance.now();
    }else{
      state.lastSeen = Date.now(); save();
    }
  });
  window.addEventListener('beforeunload', save);

  /* ============ 主循环 ============ */
  var lastTime = performance.now();
  var uiAcc = 0, saveAcc = 0;
  function loop(now){
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    if(dt > 0.1) dt = 0.05; // 后台/卡顿的大跳忽略，交给离线结算
    tick(dt);
    drawScene(now / 1000);

    uiAcc += dt;
    if(uiAcc > 0.2){
      uiAcc = 0;
      checkAchievements();
      updateStatus();
      updateShop();
    }
    saveAcc += dt;
    if(saveAcc > 5){ saveAcc = 0; save(); }
    requestAnimationFrame(loop);
  }

  /* ============ 初始化 ============ */
  function init(){
    resizeCanvas();
    buildShop();
    renderAchievements();
    var loaded = load();
    if(loaded){
      var gap = (Date.now() - (state.lastSeen || Date.now())) / 1000;
      if(gap > 5) settleOffline(gap);
      toast('欢迎回到暖阳菜园', 'info');
    }else{
      toast('欢迎来到暖阳菜园！点右侧种子选种，再点空地播种', 'info');
    }
    checkAchievements();
    updateStatus();
    updateShop();
    state.lastSeen = Date.now();
    lastTime = performance.now();
    requestAnimationFrame(loop);
    setInterval(save, 5000);
  }
  init();
})();
</script>
</body>
